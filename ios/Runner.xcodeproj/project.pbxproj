		0B1891764E04B3E106D6812F /* Crashlytics: upload dSYM */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Crashlytics: upload dSYM";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "\n#!/bin/bash\n# Uploads this build's dSYM to Crashlytics. Symbols are not a nicety: without\n# them Crashlytics cannot process incoming iOS reports and they never appear in\n# the console AT ALL. That is how every 2607.x build reached >20k users with\n# zero recorded crashes while old 3.5.x builds kept reporting normally.\n#\n# This calls Firebase's own upload-symbols (via the pod's `run` wrapper), which\n# reads the app id straight out of GoogleService-Info.plist. The previous\n# `flutterfire upload-crashlytics-symbols` command additionally required\n# ios/firebase_app_id_file.json (written by `flutterfire configure`); that file\n# has never existed here, so the phase silently uploaded nothing and exited 0.\n#\n# The release lane also uploads the whole .xcarchive dSYM folder (see\n# ios/fastlane/Fastfile) to cover Flutter.framework and the plugins.\n\n# Debug builds produce no dSYM (DEBUG_INFORMATION_FORMAT=dwarf) and do not\n# report crashes, so never fail a developer build over symbol upload.\nif [ \"${CONFIGURATION}\" = \"Debug\" ]; then\n  exit 0\nfi\n\nif [ -n \"$PODS_ROOT\" ] && [ -d \"$PODS_ROOT/FirebaseCrashlytics\" ]; then\n  RUN_SCRIPT=\"$PODS_ROOT/FirebaseCrashlytics/run\"\nelse\n  # PODS_ROOT is not always exported to this phase (seen on CI archives);\n  # the pods live next to the project regardless.\n  RUN_SCRIPT=\"${SRCROOT}/Pods/FirebaseCrashlytics/run\"\nfi\nGSP=\"${SRCROOT}/Runner/GoogleService-Info.plist\"\n\n# Fail loudly. A missing run script or plist means this build ships blind, and\n# a warning here is exactly what went unnoticed for the whole 2607 series.\nif [ ! -f \"$RUN_SCRIPT\" ]; then\n  echo \"error: Crashlytics run script not found at $RUN_SCRIPT - crash reports from this build would never be processed. Run 'pod install' in ios/.\"\n  exit 1\nfi\nif [ ! -f \"$GSP\" ]; then\n  echo \"error: $GSP not found - Crashlytics symbol upload cannot resolve the Firebase app id.\"\n  exit 1\nfi\n\n# The `run` wrapper adds --build-phase (dSYM paths + platform come from the\n# build environment) and, after a synchronous validation pass, performs the\n# actual upload in the BACKGROUND with output discarded. So a failure here is\n# invisible - which is why the release lane uploads the archive dSYMs again\n# through fastlane, where errors surface and fail the build.\n\"$RUN_SCRIPT\" -gsp \"$GSP\"\n";
		};
