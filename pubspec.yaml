name: medito
description: A meditation learning tool
publish_to: none

# Build and deploy/upload commands:
# Check version, then build & deploy/upload both platforms:
# ./build_all.sh
#
# Build and upload iOS only:
# ./build_ios.sh
#
# Build and run Android on device:
# ./build_android.sh
#
# Just build Android APK (used by the script above):
# ./build_apk.sh

version: 2605.21.0+302414

environment:
  sdk: "^3.8.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.0.0
  app_tracking_transparency: ^2.0.6+1
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  device_info_plus: ^12.3.0
  disable_battery_optimization: ^1.1.2
  do_not_disturb: ^1.0.3
  email_validator: ^3.0.0
  equatable: ^2.0.8
  firebase_analytics: ^12.2.0
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.2.1
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0
  flutter_markdown: ^0.7.7+1
  flutter_riverpod: ^3.3.1
  flutter_secure_storage: ^10.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_stripe: 12.6.0
  flutter_svg: ^2.2.4
  facebook_app_events: ^0.27.1
  freezed_annotation: ^3.1.0
  health: ^13.3.1
  http: ^1.6.0
  image: ^4.8.0
  in_app_review: ^2.0.11
  intl: ^0.20.2
  json_annotation: ^4.11.0
  just_audio: ^0.10.5
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  reorderables: ^0.6.0
  riverpod_annotation: ^4.0.2
  rxdart: ^0.28.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0
  table_calendar: ^3.2.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  webview_flutter: ^4.10.0
  xml: ^6.6.1
  xml2json: ^6.2.7
  home_widget: ^0.9.1
  dynamic_app_icon_flutter_plus: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.14.1
  device_preview: ^1.3.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  firebase_core_platform_interface: any
  mocktail: ^1.0.5
  mockito: ^5.6.4
  plugin_platform_interface: any
  pigeon: ^26.3.2
  riverpod_generator: ^4.0.3
  integration_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/
    - assets/images/
    - assets/images/app_icons/ios/
    - assets/images/app_icons/android/
  fonts:
    - family: Source Serif
      fonts:
        - asset: assets/fonts/source-serif/SourceSerif4-Regular.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Medium.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-SemiBold.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Bold.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/dm-mono/DMMono-Medium.ttf
        - asset: assets/fonts/dm-mono/DMMono-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm-sans/DMSans-Bold.ttf
        - asset: assets/fonts/dm-sans/DMSans-Medium.ttf
        - asset: assets/fonts/dm-sans/DMSans-Regular.ttf
        - asset: assets/fonts/dm-sans/DMSans-SemiBold.ttf
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Italic.ttf
    - family: Teachers
      fonts:
        - asset: assets/fonts/teachers/Teachers-Regular.ttf
        - asset: assets/fonts/teachers/Teachers-Bold.ttf
        - asset: assets/fonts/teachers/Teachers-Medium.ttf
        - asset: assets/fonts/teachers/Teachers-SemiBold.ttf
  uses-material-design: true
