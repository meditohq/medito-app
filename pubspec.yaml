name: medito
description: A meditation learning tool
publish_to: none

# Build and deploy/upload commands:
# Check version, then build & deploy/upload both platforms:
# ./build_all.sh
#
# Build and upload iOS only:
# ./build_ios.sh
#
# Build and run Android on device:
# ./build_android.sh
#
# Just build Android APK (used by the script above):
# ./build_apk.sh

version: 3.5.66+30214

environment:
  sdk: "^3.8.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^7.0.0
  app_tracking_transparency: ^2.0.6+1
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  device_info_plus: ^12.3.0
  do_not_disturb: ^1.0.3
  email_validator: ^3.0.0
  equatable: ^2.0.5
  firebase_analytics: ^12.1.3
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^19.2.1
  flutter_markdown: ^0.7.4+1
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0
  flutter_stripe: 12.3.0
  flutter_svg: ^2.2.0
  facebook_app_events: ^0.24.0
  freezed_annotation: ^3.1.0
  haptic_feedback: ^0.6.4+3
  health: ^13.3.1
  http: ^1.6.0
  image: ^4.1.4
  in_app_review: ^2.0.10
  intl: ^0.20.2
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  package_info_plus: ^9.0.0
  path_provider: ^2.1.2
  permission_handler: ^12.0.1
  reorderables: ^0.6.0
  riverpod_annotation: ^4.0.0
  rxdart: ^0.28.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  table_calendar: ^3.1.2
  superwallkit_flutter: 2.4.10
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.0
  xml: ^6.5.0
  xml2json: ^6.2.7
  home_widget: ^0.8.1
  dynamic_app_icon_flutter_plus: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.12.2
  device_preview: ^1.3.1
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  json_serializable: 6.11.2
  mocktail: ^1.0.2
  mockito: ^5.4.6
  pigeon: ^26.1.5
  riverpod_generator: ^4.0.0+1
  integration_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/
    - assets/images/
    - assets/images/app_icons/
  fonts:
    - family: Source Serif
      fonts:
        - asset: assets/fonts/source-serif/SourceSerif4-Regular.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Medium.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-SemiBold.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Bold.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/dm-mono/DMMono-Medium.ttf
        - asset: assets/fonts/dm-mono/DMMono-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm-sans/DMSans-Bold.ttf
        - asset: assets/fonts/dm-sans/DMSans-Medium.ttf
        - asset: assets/fonts/dm-sans/DMSans-Regular.ttf
        - asset: assets/fonts/dm-sans/DMSans-SemiBold.ttf
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Italic.ttf
    - family: Teachers
      fonts:
        - asset: assets/fonts/teachers/Teachers-Regular.ttf
        - asset: assets/fonts/teachers/Teachers-Bold.ttf
        - asset: assets/fonts/teachers/Teachers-Medium.ttf
        - asset: assets/fonts/teachers/Teachers-SemiBold.ttf
  uses-material-design: true
