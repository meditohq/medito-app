name: medito
description: A meditation learning tool
publish_to: none

# Build and deploy/upload commands:
# Check version, then build & deploy/upload both platforms:
# ./build_all.sh
#
# Build and upload iOS only:
# ./build_ios.sh
#
# Build and run Android on device:
# ./build_android.sh
#
# Just build Android APK (used by the script above):
# ./build_apk.sh

version: 3.5.16+30156


environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_links: ^6.4.0
  app_tracking_transparency: ^2.0.4
  audio_service: ^0.18.15
  audio_session: ^0.2.2
  cached_network_image: ^3.4.1
  crypto: ^3.0.6
  device_info_plus: ^12.2.0
  do_not_disturb: ^1.0.3
  email_validator: ^3.0.0
  equatable: ^2.0.5
  firebase_analytics: ^12.0.3
  firebase_core: ^4.2.0
  firebase_crashlytics: ^5.0.3
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.2.1
  flutter_markdown: ^0.7.4+1
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  flutter_staggered_grid_view: ^0.7.0
  flutter_stripe: 12.0.2
  flutter_svg: ^2.2.0
  font_awesome_flutter: ^10.8.0
  freezed_annotation: ^3.1.0
  haptic_feedback: ^0.5.1+1
  tiktok_events_sdk: ^1.0.9
  health: ^13.2.1
  home_widget: ^0.8.1
  http: ^1.4.0
  hugeicons:
    hosted: https://onepub.dev/api/kdpxxpsdav
    version: ^0.0.12
  image: ^4.1.4
  in_app_review: ^2.0.10
  intl: ^0.20.2
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  package_info_plus: ^9.0.0
  path_provider: ^2.1.2
  pay: ^3.2.1
  permission_handler: ^12.0.1
  reorderables: ^0.6.0
  riverpod_annotation: ^2.6.1
  rxdart: ^0.28.0
  share_plus: ^12.0.1
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  superwallkit_flutter: ^2.4.2
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.0
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main
  xml: ^6.5.0
  xml2json: ^6.2.7

dependency_overrides:
  superwallkit_flutter: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^7.4.5
  build_runner: ^2.5.2
  device_preview: ^1.2.0
  flutter_lints: ^6.0.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.2
  mockito: ^5.4.6
  pigeon: ^25.4.0
  riverpod_generator: ^2.6.1
  integration_test:
    sdk: flutter

flutter:
  generate: true
  assets:
    - assets/
    - assets/images/
  fonts:
    - family: Source Serif
      fonts:
        - asset: assets/fonts/source-serif/SourceSerif4-Regular.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Medium.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-SemiBold.ttf
        - asset: assets/fonts/source-serif/SourceSerif4-Bold.ttf
    - family: DM Mono
      fonts:
        - asset: assets/fonts/dm-mono/DMMono-Medium.ttf
        - asset: assets/fonts/dm-mono/DMMono-Regular.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm-sans/DMSans-Bold.ttf
        - asset: assets/fonts/dm-sans/DMSans-Medium.ttf
        - asset: assets/fonts/dm-sans/DMSans-Regular.ttf
        - asset: assets/fonts/dm-sans/DMSans-SemiBold.ttf
    - family: DM Serif Display
      fonts:
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/dm-serif/DMSerifDisplay-Italic.ttf
    - family: Teachers
      fonts:
        - asset: assets/fonts/teachers/Teachers-Regular.ttf
        - asset: assets/fonts/teachers/Teachers-Bold.ttf
        - asset: assets/fonts/teachers/Teachers-Medium.ttf
        - asset: assets/fonts/teachers/Teachers-SemiBold.ttf
  uses-material-design: true
