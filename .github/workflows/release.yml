name: Build & Deploy

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      paywall_env:
        description: 'Paywall environment'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dev
      play_store_track:
        description: 'Play Store track (Android)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - beta
          - production
      platforms:
        description: 'Platforms to build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - android
          - ios

jobs:
  android-deploy:
    name: Android – Build & Deploy
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'both' || inputs.platforms == 'android'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        run: printf "%s" "${{ secrets.PROD_ENV }}" > .prod.json

      - name: Write google-services.json
        run: printf "%s" "${{ secrets.GOOGLE_SERVICES_JSON }}" > android/app/google-services.json

      - name: Write keystore.properties
        run: printf "%s" "${{ secrets.KEYSTORE_PROPERTIES }}" > android/keystore.properties

      - name: Write keystore file
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/meditokey.jks

      - name: Run Flutter tests
        run: flutter test --dart-define-from-file=.prod.json

      - name: Build APK
        run: |
          flutter build apk --flavor prod --release \
            --dart-define-from-file=.prod.json \
            --dart-define=PAYWALL_ENV=${{ inputs.paywall_env || 'live' }} \
            --obfuscate --split-debug-info=./symbols

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Upload to Play Store
        working-directory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          bundle exec fastlane android upload_apk \
            apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
            track:"${{ inputs.play_store_track || 'internal' }}"

  ios-deploy:
    name: iOS – Build & Deploy to TestFlight
    runs-on: macos-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'both' || inputs.platforms == 'ios'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        run: printf "%s" "${{ secrets.PROD_ENV }}" > .prod.json

      - name: Write GoogleService-Info.plist
        run: printf "%s" "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" > ios/Runner/GoogleService-Info.plist

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Fastlane gems
        uses: actions/cache@v4
        with:
          path: ~/.gem
          key: ${{ runner.os }}-gem-fastlane-${{ hashFiles('ios/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gem-fastlane-

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          PAYWALL_ENV: ${{ inputs.paywall_env || 'live' }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          TEMP_KEYCHAIN_USER: ${{ secrets.TEMP_KEYCHAIN_USER }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        run: fastlane beta
