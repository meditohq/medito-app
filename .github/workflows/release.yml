name: Build & Deploy

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      android_internal:
        description: 'Android – Internal track'
        type: boolean
        default: false
      android_production:
        description: 'Android – Production track'
        type: boolean
        default: true
      ios_testflight:
        description: 'iOS – TestFlight'
        type: boolean
        default: true
      ios_appstore:
        description: 'iOS – App Store draft'
        type: boolean
        default: false
      paywall_env:
        description: 'Paywall environment'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - dev
      match_readonly:
        description: 'Keep match in readonly mode (set false to refresh certs/profiles)'
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (applied to en-US, en-GB, es-MX)'
        required: false
        default: ''
        type: string

jobs:
  android-build:
    name: Android – Build
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.android_internal || inputs.android_production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write keystore.properties
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: printf '%s' "$KEYSTORE_PROPERTIES" > android/keystore.properties

      - name: Write keystore file
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KEYSTORE_FILE" | base64 -d > android/meditokey.jks

      - name: Build APK
        run: |
          flutter build apk --flavor prod --release \
            --dart-define-from-file=.prod.json \
            --dart-define=MOCK_MODE=false \
            --dart-define=PAYWALL_ENV=${{ inputs.paywall_env || 'live' }} \
            --obfuscate --split-debug-info=./symbols

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/app-prod-release.apk
          retention-days: 1

  android-smoke-test:
    name: Android – Smoke Test
    needs: [android-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            adb install build/app/outputs/apk/prod/release/app-prod-release.apk
            adb shell pm grant meditofoundation.medito android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            mkdir -p /tmp/maestro-debug
            $HOME/.maestro/bin/maestro test -e APP_ID=meditofoundation.medito .maestro/smoke.yaml --no-ansi --debug-output /tmp/maestro-debug

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## Android Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-android** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  android-deploy:
    name: Android – Deploy
    needs: [android-smoke-test]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Set release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          notes="$RELEASE_NOTES_INPUT"
          if [ -z "$notes" ]; then
            notes=$(awk '/^[0-9]/{if(in_v)exit; in_v=1;next} in_v && /^-/{print} in_v && !/^-/{if(NF)exit}' release_notes.txt)
          fi
          notes="${notes:0:500}"
          { echo "RELEASE_NOTES<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Upload to Play Store
        working-directory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            bundle exec fastlane android upload_apk \
              apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
              track:"production"
          else
            if [ "${{ inputs.android_internal }}" = "true" ]; then
              bundle exec fastlane android upload_apk \
                apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
                track:"internal"
            fi
            if [ "${{ inputs.android_production }}" = "true" ]; then
              bundle exec fastlane android upload_apk \
                apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
                track:"production"
            fi
          fi

  ios-smoke-test:
    name: iOS – Smoke Test
    if: github.event_name != 'workflow_dispatch' || inputs.ios_testflight || inputs.ios_appstore
    runs-on: macos-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache iOS app
        id: cache-ios-app
        uses: actions/cache@v4
        with:
          path: build/ios/iphonesimulator/Medito Dev.app
          key: ${{ runner.os }}-ios-app-${{ hashFiles('lib/**/*.dart', 'pubspec.lock', 'ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj') }}

      - name: Flutter pub get
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Cache build_runner outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write firebase_options.dart
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write GoogleService-Info.plist
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Install FlutterFire CLI
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: dart pub global activate flutterfire_cli

      - name: Install pods
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "System CocoaPods: $(pod --version)"
          if ! pod --version | grep -q '^1\.16\.'; then
            echo "Installing CocoaPods 1.16.x to match Podfile.lock…"
            gem install cocoapods -v '~> 1.16.2' --no-document
            echo "Installed CocoaPods: $(pod --version)"
          fi
          pod install

      - name: Build iOS simulator app
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: |
          flutter build ios --simulator --no-codesign \
            --dart-define-from-file=.prod.json \
            --dart-define=MOCK_MODE=false \
            --dart-define=PAYWALL_ENV=live \
            --dart-define=IS_SIMULATOR=true

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            for d in devices:
              if 'iPhone' in d['name'] and d['isAvailable']:
                print(d['udid'])
                sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE"
          # Block until SpringBoard is fully ready (not just kernel boot)
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Booted simulator: $DEVICE"

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Smoke test on simulator
        timeout-minutes: 12
        run: |
          xcrun simctl install booted "build/ios/iphonesimulator/Medito Dev.app"
          # Give SpringBoard a few extra seconds to settle before Maestro connects
          sleep 5
          mkdir -p /tmp/maestro-debug
          $HOME/.maestro/bin/maestro test \
            -e APP_ID=org.meditofoundation \
            .maestro/smoke.yaml \
            --no-ansi --debug-output /tmp/maestro-debug

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## iOS Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-ios** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  ios-deploy:
    name: iOS – Build & Deploy
    needs: [ios-smoke-test]
    runs-on: macos-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.ios_testflight || inputs.ios_appstore

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.41.4'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Validate plist files
        run: |
          plutil -lint ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerRelease.entitlements

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Cache Fastlane gems
        uses: actions/cache@v4
        with:
          path: ~/.gem
          key: ${{ runner.os }}-gem-fastlane-${{ hashFiles('ios/Gemfile.lock') }}
          restore-keys: ${{ runner.os }}-gem-fastlane-

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Set release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          notes="$RELEASE_NOTES_INPUT"
          if [ -z "$notes" ]; then
            notes=$(awk '
              /^Unreleased/ { unrel_seen = 1; next }
              /^[0-9]/ {
                if (!in_v) {
                  # Start capturing at the first version header after "Unreleased",
                  # or the first version header in the file if no "Unreleased" exists.
                  if (unrel_seen || !unrel_seen) {
                    in_v = 1
                    next
                  }
                } else {
                  # Reaching another version header ends the current block.
                  exit
                }
              }
              in_v && /^-/ { print; next }
              in_v && NF && !/^- / { exit }
            ' release_notes.txt)
          fi
          notes="${notes:0:500}"
          { echo "RELEASE_NOTES<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Build & upload iOS release
        working-directory: ios
        env:
          PAYWALL_ENV: ${{ inputs.paywall_env || 'live' }}
          MATCH_READONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.match_readonly || false }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          TEMP_KEYCHAIN_USER: ${{ secrets.TEMP_KEYCHAIN_USER }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            fastlane release
          else
            if [ "${{ inputs.ios_testflight }}" = "true" ]; then
              fastlane beta
            fi
            if [ "${{ inputs.ios_appstore }}" = "true" ]; then
              fastlane release
            fi
          fi
