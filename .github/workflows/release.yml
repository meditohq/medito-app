name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      android_internal:
        description: 'Android – Internal track'
        type: boolean
        default: false
      android_production:
        description: 'Android – Production track'
        type: boolean
        default: true
      ios_testflight:
        description: 'iOS – TestFlight'
        type: boolean
        default: true
      ios_appstore:
        description: 'iOS – App Store draft'
        type: boolean
        default: false
      match_readonly:
        description: 'Keep match in readonly mode (set false to refresh certs/profiles)'
        type: boolean
        default: true
      release_notes:
        description: 'Release notes (applied to en-US, en-GB, es-MX)'
        required: false
        default: ''
        type: string
      submit_for_review:
        description: 'Submit builds to store review automatically (Play: production release publishes on approval; iOS: App Store version is submitted, released manually after approval)'
        type: boolean
        default: false
      android_promote_to_production:
        description: 'Promote the latest Android INTERNAL release to production — no new build; goes to Play review and publishes on approval. Standalone: other toggles can stay off.'
        type: boolean
        default: false

jobs:
  # Standalone promote path: ships the release already sitting on the internal
  # track to production without rebuilding — that binary passed the build and
  # smoke gates when it was uploaded. Exists so a release can be shipped from
  # anywhere the Actions UI runs (e.g. the GitHub mobile app), where the Play
  # Console's promote button isn't available.
  android-promote:
    name: Android – Promote internal to production
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name == 'workflow_dispatch' && inputs.android_promote_to_production

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Promote internal release to production
        working-directory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: bundle exec fastlane android promote_internal

  android-build:
    name: Android – Build
    runs-on: ubuntu-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.android_internal || inputs.android_production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write keystore.properties
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: printf '%s' "$KEYSTORE_PROPERTIES" > android/keystore.properties

      - name: Write keystore file
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: printf '%s' "$KEYSTORE_FILE" | base64 -d > android/meditokey.jks

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Shorebird release (Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          # Builds the store APK WITH the Shorebird engine so this release is
          # patchable over-the-air. --artifact apk keeps the existing output path
          # (build/app/outputs/apk/prod/release/app-prod-release.apk), so the
          # "Upload APK artifact" + "Upload to Play Store" steps stay unchanged.
          # Shorebird-level flags (flavor, obfuscation, flutter version) go BEFORE
          # `--`; flutter build args go AFTER it. Obfuscation is auto-matched on
          # patch, so pass --obfuscate/--split-debug-info on release only.
          shorebird release android \
            --flutter-version=3.44.7 \
            --flavor prod \
            --artifact apk \
            --split-debug-info=./symbols --obfuscate \
            -- \
            --dart-define-from-file=.prod.json \
            --dart-define=MOCK_MODE=false
          # First-run sanity check: confirm the APK landed where the downstream
          # "Upload APK artifact" + Play upload steps expect it.
          ls -lh build/app/outputs/apk/prod/release/app-prod-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/app-prod-release.apk
          # 90 days so the next release's upgrade test can pull the
          # previously-shipped APK as its "old version" baseline.
          retention-days: 90

  android-smoke-test:
    name: Android – Smoke Test
    needs: [android-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            adb install build/app/outputs/apk/prod/release/app-prod-release.apk
            adb shell pm grant meditofoundation.medito android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            mkdir -p /tmp/maestro-debug
            $HOME/.maestro/bin/maestro test -e APP_ID=meditofoundation.medito .maestro/smoke.yaml --no-ansi --debug-output /tmp/maestro-debug

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## Android Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-android** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  android-upgrade-test:
    name: Android – Upgrade Test
    needs: [android-smoke-test]
    runs-on: ubuntu-latest
    # Non-blocking: a failed upgrade test won't gate the deploy. Useful when
    # there's no baseline yet, or to avoid blocking ship on a flaky test.
    continue-on-error: true

    steps:
      # fetch-depth: 0 so we can resolve previous tags and `git show` the
      # smoke.yaml that matches the previously-shipped binary.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NEW APK (this release) — already built and uploaded upstream.
      - name: Download NEW APK
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release
          path: /tmp/new/

      # Resolve the *previous* release tag. On tag pushes GITHUB_REF_NAME is
      # the current tag, so we filter it out. On workflow_dispatch (ref is a
      # branch like "develop"), the grep -v is a no-op and we get the latest
      # v* tag as the baseline.
      - name: Resolve previous release tag
        id: prev
        run: |
          PREV=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                 | grep -v "^${GITHUB_REF_NAME}$" \
                 | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous release tag found." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            SHA=$(git rev-list -n 1 "$PREV")
            echo "Previous release: **$PREV** ($SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      # OLD APK — pinned to the previous tag's exact commit, so the
      # downloaded APK matches the seed flow we'll extract from git below.
      - name: Download OLD APK (pinned to previous tag's commit)
        id: old-apk
        if: steps.prev.outputs.sha != ''
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: release.yml
          workflow_conclusion: success
          name: app-prod-release
          commit: ${{ steps.prev.outputs.sha }}
          path: /tmp/old/
          if_no_artifact_found: warn

      # OLD seed flow — checked out from the previous tag's tree, so it
      # describes that binary's onboarding UI (not HEAD's).
      - name: Extract OLD seed flow from previous tag
        if: steps.prev.outputs.sha != ''
        run: |
          git show "${{ steps.prev.outputs.sha }}:.maestro/smoke.yaml" \
            > /tmp/old-seed.yaml || echo "Previous tag had no smoke.yaml"

      - name: Skip if no baseline available
        id: gate
        run: |
          if [ ! -f /tmp/old/app-prod-release.apk ] || [ ! -s /tmp/old-seed.yaml ]; then
            echo "No usable baseline (APK or seed flow missing) — skipping upgrade test." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM
        if: steps.gate.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Upgrade test on emulator
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # NOTE: android-emulator-runner executes each line in its own shell,
          # so env vars don't persist across lines and `\` continuations break.
          # Keep each command on a single line and inline the app id.
          script: |
            curl -Ls "https://get.maestro.mobile.dev" | bash
            mkdir -p /tmp/maestro-debug/seed /tmp/maestro-debug/upgrade
            adb install /tmp/old/app-prod-release.apk
            adb shell pm grant meditofoundation.medito android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            $HOME/.maestro/bin/maestro test -e APP_ID=meditofoundation.medito /tmp/old-seed.yaml --no-ansi --debug-output /tmp/maestro-debug/seed
            adb install -r /tmp/new/app-prod-release.apk
            $HOME/.maestro/bin/maestro test -e APP_ID=meditofoundation.medito .maestro/upgrade.yaml --no-ansi --debug-output /tmp/maestro-debug/upgrade

      - name: Upload upgrade-test debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-android-upgrade
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## Android Upgrade Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are in the **maestro-debug-android-upgrade** artifact." >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`${img#/tmp/maestro-debug/}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  android-deploy:
    name: Android – Deploy
    needs: [android-smoke-test, android-upgrade-test]
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-prod-release
          path: build/app/outputs/apk/prod/release/

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: android

      - name: Set release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          notes="$RELEASE_NOTES_INPUT"
          if [ -z "$notes" ]; then
            notes=$(awk '/^[0-9]/{if(in_v)exit; in_v=1;next} in_v && /^-/{print} in_v && !/^-/{if(NF)exit}' release_notes.txt)
          fi
          notes="${notes:0:500}"
          { echo "RELEASE_NOTES<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Upload to Play Store
        working-directory: android
        env:
          PLAY_STORE_CONFIG_JSON: ${{ secrets.PLAY_STORE_CONFIG_JSON }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            bundle exec fastlane android upload_apk \
              apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
              track:"production"
          else
            # An APK can't be uploaded to two tracks in separate edits — Google
            # rejects the second with "Cannot update a published APK". When
            # both internal and production are requested, upload to internal
            # and promote to production in the same edit.
            if [ "${{ inputs.android_internal }}" = "true" ] && [ "${{ inputs.android_production }}" = "true" ]; then
              bundle exec fastlane android upload_apk \
                apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
                track:"internal" \
                promote_to:"production" \
                submit_review:"${{ inputs.submit_for_review }}"
            elif [ "${{ inputs.android_production }}" = "true" ]; then
              bundle exec fastlane android upload_apk \
                apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
                track:"production" \
                submit_review:"${{ inputs.submit_for_review }}"
            elif [ "${{ inputs.android_internal }}" = "true" ]; then
              bundle exec fastlane android upload_apk \
                apk_path:"../build/app/outputs/apk/prod/release/app-prod-release.apk" \
                track:"internal"
            fi
          fi

  ios-smoke-test:
    name: iOS – Smoke Test
    if: github.event_name != 'workflow_dispatch' || inputs.ios_testflight || inputs.ios_appstore
    runs-on: macos-latest
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Icon Composer requires 26+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Cache iOS app
        id: cache-ios-app
        uses: actions/cache@v4
        with:
          path: build/ios/iphonesimulator/Medito Dev.app
          key: ${{ runner.os }}-ios-app-${{ hashFiles('lib/**/*.dart', 'pubspec.lock', 'ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj') }}

      - name: Flutter pub get
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: Cache build_runner outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-ios-app.outputs.cache-hit != 'true' && steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write firebase_options.dart
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write GoogleService-Info.plist
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Install FlutterFire CLI
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: dart pub global activate flutterfire_cli

      # Populate the Flutter engine artifacts (Flutter.xcframework) that the
      # Podfile post-install hook expects. The master channel does not
      # precache iOS engine artifacts automatically, unlike stable.
      - name: Flutter precache iOS
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: flutter precache --ios

      - name: Install pods
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        working-directory: ios
        run: |
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "System CocoaPods: $(pod --version)"
          if ! pod --version | grep -q '^1\.16\.'; then
            echo "Installing CocoaPods 1.16.x to match Podfile.lock…"
            gem install cocoapods -v '~> 1.16.2' --no-document
            echo "Installed CocoaPods: $(pod --version)"
          fi
          pod install

      - name: Build iOS simulator app
        if: steps.cache-ios-app.outputs.cache-hit != 'true'
        run: |
          flutter build ios --simulator --no-codesign \
            --dart-define-from-file=.prod.json \
            --dart-define=MOCK_MODE=false \
            --dart-define=SMOKE_TEST_MODE=true \
            --dart-define=IS_SIMULATOR=true

      # Preserve the built .app so the upgrade-test job (next release) can
      # install it as the "old version" baseline. Tar to preserve the app
      # bundle's internal symlinks/permissions through the artifact upload.
      - name: Package simulator .app
        run: |
          mkdir -p /tmp/sim-app
          tar -C build/ios/iphonesimulator -cf /tmp/sim-app/medito-sim.tar "Medito Dev.app"

      - name: Upload simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: medito-sim-app
          path: /tmp/sim-app/medito-sim.tar
          retention-days: 90

      - name: Boot iOS simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            for d in devices:
              if 'iPhone' in d['name'] and d['isAvailable']:
                print(d['udid'])
                sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE"
          # Block until SpringBoard is fully ready (not just kernel boot)
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Booted simulator: $DEVICE"

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Smoke test on simulator
        timeout-minutes: 12
        run: |
          xcrun simctl install booted "build/ios/iphonesimulator/Medito Dev.app"
          # Give SpringBoard a few extra seconds to settle before Maestro connects
          sleep 5
          mkdir -p /tmp/maestro-debug
          $HOME/.maestro/bin/maestro test \
            -e APP_ID=org.meditofoundation \
            .maestro/smoke.yaml \
            --no-ansi --debug-output /tmp/maestro-debug

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## iOS Maestro Smoke Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are available in the **maestro-debug-ios** artifact above." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Screenshots captured" >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`$(basename "$img")\`" >> "$GITHUB_STEP_SUMMARY"
          done

  ios-upgrade-test:
    name: iOS – Upgrade Test
    needs: [ios-smoke-test]
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || inputs.ios_testflight || inputs.ios_appstore
    # Non-blocking: a failed upgrade test won't gate the deploy. Useful when
    # there's no baseline yet, or to avoid blocking ship on a flaky test.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NEW .app (this release) — uploaded by ios-smoke-test.
      - name: Download NEW simulator .app
        uses: actions/download-artifact@v4
        with:
          name: medito-sim-app
          path: /tmp/new/

      - name: Unpack NEW .app
        run: |
          mkdir -p /tmp/new/app
          tar -C /tmp/new/app -xf /tmp/new/medito-sim.tar

      - name: Resolve previous release tag
        id: prev
        run: |
          PREV=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
                 | grep -v "^${GITHUB_REF_NAME}$" \
                 | head -1)
          if [ -z "$PREV" ]; then
            echo "No previous release tag found." >> "$GITHUB_STEP_SUMMARY"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            SHA=$(git rev-list -n 1 "$PREV")
            echo "Previous release: **$PREV** ($SHA)" >> "$GITHUB_STEP_SUMMARY"
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          fi

      # OLD .app — pinned to the previous tag's exact commit.
      - name: Download OLD .app (pinned to previous tag's commit)
        id: old-app
        if: steps.prev.outputs.sha != ''
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: release.yml
          workflow_conclusion: success
          name: medito-sim-app
          commit: ${{ steps.prev.outputs.sha }}
          path: /tmp/old/
          if_no_artifact_found: warn

      - name: Extract OLD seed flow from previous tag
        if: steps.prev.outputs.sha != ''
        run: |
          git show "${{ steps.prev.outputs.sha }}:.maestro/smoke.yaml" \
            > /tmp/old-seed.yaml || echo "Previous tag had no smoke.yaml"

      - name: Skip if no baseline available
        id: gate
        run: |
          if [ ! -f /tmp/old/medito-sim.tar ] || [ ! -s /tmp/old-seed.yaml ]; then
            echo "No usable baseline (.app or seed flow missing) — skipping upgrade test." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            mkdir -p /tmp/old/app
            tar -C /tmp/old/app -xf /tmp/old/medito-sim.tar
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot iOS simulator
        if: steps.gate.outputs.run == 'true'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            for d in devices:
              if 'iPhone' in d['name'] and d['isAvailable']:
                print(d['udid'])
                sys.exit(0)
          sys.exit(1)
          ")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Booted simulator: $DEVICE"

      - name: Install Maestro
        if: steps.gate.outputs.run == 'true'
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Upgrade test on simulator
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 20
        run: |
          mkdir -p /tmp/maestro-debug/seed /tmp/maestro-debug/upgrade

          # 1. Install OLD version onto the booted simulator.
          xcrun simctl install booted "/tmp/old/app/Medito Dev.app"
          sleep 5

          # 2. Seed state using the OLD tag's smoke.yaml — matches that
          #    binary's onboarding UI even if HEAD has renamed strings.
          $HOME/.maestro/bin/maestro test \
            -e APP_ID=org.meditofoundation /tmp/old-seed.yaml \
            --no-ansi --debug-output /tmp/maestro-debug/seed

          # 3. In-place upgrade. simctl install over an existing bundle ID
          #    keeps the app's container (NSUserDefaults, Hive, Documents).
          xcrun simctl install booted "/tmp/new/app/Medito Dev.app"
          sleep 5

          # 4. Verify upgraded app lands on home with state intact.
          #    Uses HEAD's upgrade.yaml — it validates the NEW binary.
          $HOME/.maestro/bin/maestro test \
            -e APP_ID=org.meditofoundation .maestro/upgrade.yaml \
            --no-ansi --debug-output /tmp/maestro-debug/upgrade

      - name: Upload upgrade-test debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios-upgrade
          path: /tmp/maestro-debug/
          retention-days: 30
          include-hidden-files: true

      - name: Embed failure screenshots in job summary
        if: failure()
        run: |
          echo "## iOS Upgrade Test Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Screenshots are in the **maestro-debug-ios-upgrade** artifact." >> "$GITHUB_STEP_SUMMARY"
          find /tmp/maestro-debug -name '*.png' 2>/dev/null | sort | while read -r img; do
            echo "- \`${img#/tmp/maestro-debug/}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  ios-deploy:
    name: iOS – Build & Deploy
    # TEMP BYPASS (Shorebird deploy validation only — MUST RESTORE before merge):
    # needs: [ios-smoke-test, ios-upgrade-test]
    runs-on: macos-latest
    environment: prod
    if: github.event_name != 'workflow_dispatch' || inputs.ios_testflight || inputs.ios_appstore

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (Icon Composer requires 26+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Flutter pub get
        run: flutter pub get

      # Populate the Flutter engine artifacts (Flutter.xcframework) that
      # cocoapods' post-install hook needs. Master channel does not
      # precache iOS engine artifacts automatically.
      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Install FlutterFire CLI
        run: dart pub global activate flutterfire_cli

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run build_runner
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run pigeon
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Write .prod.json
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          raw = os.environ["PROD_ENV"]

          try:
            data = json.loads(raw)
          except json.JSONDecodeError:
            data = {}
            for line in raw.strip().strip("{}").splitlines():
              line = line.strip().rstrip(",")
              if ":" in line:
                key, _, value = line.partition(":")
                data[key.strip()] = value.strip()

          if not data:
            sys.exit("Failed to parse PROD_ENV secret")

          with open(".prod.json", "w") as f:
            json.dump(data, f, indent=2)
          PY

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: printf '%s' "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 -d > ios/Runner/GoogleService-Info.plist

      - name: Validate plist files
        run: |
          plutil -lint ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/Runner/RunnerRelease.entitlements

      # Bundler-managed fastlane so the fastlane-plugin-shorebird plugin actually
      # loads (bare `gem install` + a Pluginfile does NOT register a plugin with
      # bare `fastlane`). Prereq: run `cd ios && fastlane add_plugin shorebird`
      # locally and commit ios/Gemfile, ios/Gemfile.lock, ios/fastlane/Pluginfile.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: Set release notes
        env:
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
        run: |
          notes="$RELEASE_NOTES_INPUT"
          if [ -z "$notes" ]; then
            notes=$(awk '
              /^Unreleased/ { unrel_seen = 1; next }
              /^[0-9]/ {
                if (!in_v) {
                  # Start capturing at the first version header after "Unreleased",
                  # or the first version header in the file if no "Unreleased" exists.
                  if (unrel_seen || !unrel_seen) {
                    in_v = 1
                    next
                  }
                } else {
                  # Reaching another version header ends the current block.
                  exit
                }
              }
              in_v && /^-/ { print; next }
              in_v && NF && !/^- / { exit }
            ' release_notes.txt)
          fi
          notes="${notes:0:500}"
          { echo "RELEASE_NOTES<<EOF"; echo "$notes"; echo "EOF"; } >> "$GITHUB_ENV"

      - name: Build & upload iOS release
        working-directory: ios
        env:
          MATCH_READONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.match_readonly || false }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '8'
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          TEMP_KEYCHAIN_USER: ${{ secrets.TEMP_KEYCHAIN_USER }}
          TEMP_KEYCHAIN_PASSWORD: ${{ secrets.TEMP_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            bundle exec fastlane release
          else
            if [ "${{ inputs.ios_testflight }}" = "true" ]; then
              bundle exec fastlane beta
            fi
            if [ "${{ inputs.ios_appstore }}" = "true" ]; then
              bundle exec fastlane release submit_for_review:"${{ inputs.submit_for_review }}"
            fi
          fi

  # After a successful deploy, tag the built commit with the pubspec version
  # (bare semver, no v prefix — matches existing tags). Runs only when at
  # least one deploy job actually deployed, and is a no-op if the tag already
  # exists, so re-runs and manual tags don't conflict.
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [android-deploy, ios-deploy]
    if: >-
      !failure() && !cancelled() &&
      contains(needs.*.result, 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag commit with pubspec version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists — nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Created tag $VERSION at $GITHUB_SHA"
