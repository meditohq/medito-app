# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    branches: [ develop ]
    tags-ignore:
      - '**'
  pull_request:
    branches: [ develop ]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter version
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: 'stable'

      - name: Flutter Stable
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: flutter channel stable

      - name: Flutter Upgrade
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: flutter upgrade

      - name: Setup OnePub
        env:
          ONEPUB_TOKEN: ${{ secrets.ONEPUB_TOKEN }}
        run: |
          echo "Setting up OnePub..."
          mkdir -p $PUB_CACHE/credentials
          dart pub global activate onepub
          dart pub global run onepub import
          echo "Verifying OnePub setup..."
          ls -la $PUB_CACHE/credentials/ || echo "Failed to list credentials directory"
          cat $PUB_CACHE/credentials/credentials.json || echo "Failed to read credentials file"
          # Add pub credentials directly
          echo '{
            "https://onepub.dev/api/kdpxxpsdav/": {
              "token": "${{ secrets.ONEPUB_TOKEN }}"
            }
          }' > $PUB_CACHE/credentials/credentials.json

      - name: Flutter Pub Get
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: flutter pub get

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          DART_PATH=$(dirname $(which dart))
          echo "DART_PATH=$DART_PATH" >> $GITHUB_ENV

      - name: Write .prod.json (stub values for tests)
        run: |
          cat > .prod.json <<'JSON'
          {
            "APP_KEY": "test",
            "ENVIRONMENT": "debug",
            "CONTENT_BASE_URL": "https://example.invalid/",
            "AUTH_URL": "https://example.invalid/",
            "EDIT_STATS_URL": "https://example.invalid/",
            "DONATION_BASE_URL": "https://example.invalid/",
            "DONATION_TOKEN": "test",
            "SUPERWALL_API_KEY": "test",
            "TIKTOK_ANDROID_APP_ID": "0",
            "TIKTOK_IOS_APP_ID": "0"
          }
          JSON

      - name: Create stub firebase_options.dart for tests
        run: |
          mkdir -p lib
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'test',
                appId: 'test',
                messagingSenderId: 'test',
                projectId: 'test',
              );
            }
          }
          DART

      - name: Run Riverpod generator
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Run Pigeon generator
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Run Unit Tests
        run: flutter test --coverage --dart-define-from-file=.prod.json

      - name: Upload Test Coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: build/
