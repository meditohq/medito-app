# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    tags-ignore:
      - '*'
  pull_request:
    # 'labeled' lets adding the auto-ready label kick off the checks + auto
    # ready-for-review flow on a PR whose CI already ran.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  checks:
    # Don't re-run the full CI when unrelated labels are added.
    if: github.event.action != 'labeled' || github.event.label.name == 'auto-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Java version
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter version
        uses: subosito/flutter-action@v2.12.0
        with:
          flutter-version: '3.41.4'

      - name: Flutter Pub Get
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 2
          command: flutter pub get

      - name: Check Flutter and Dart versions
        run: |
          flutter --version
          DART_PATH=$(dirname $(which dart))
          echo "DART_PATH=$DART_PATH" >> $GITHUB_ENV

      - name: Write .prod.json (stub values for tests)
        run: |
          cat > .prod.json <<'JSON'
          {
            "APP_KEY": "test",
            "ENVIRONMENT": "debug",
            "CONTENT_BASE_URL": "https://example.invalid/",
            "AUTH_URL": "https://example.invalid/",
            "EDIT_STATS_URL": "https://example.invalid/",
            "DONATION_BASE_URL": "https://example.invalid/",
            "DONATION_TOKEN": "test",
            "STRIPE_TEST_PUBLISHABLE_KEY": "test",
            "STRIPE_LIVE_PUBLISHABLE_KEY": "test",
            "FACEBOOK_APP_ID": "test",
            "FACEBOOK_CLIENT_TOKEN": "test"
          }
          JSON

      - name: Create stub firebase_options.dart for tests
        run: |
          mkdir -p lib
          cat > lib/firebase_options.dart <<'DART'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'test',
                appId: 'test',
                messagingSenderId: 'test',
                projectId: 'test',
              );
            }
          }
          DART

      - name: Cache build_runner outputs
        id: cache-buildrunner
        uses: actions/cache@v4
        with:
          path: |
            lib/**/*.g.dart
            lib/**/*.freezed.dart
          key: ${{ runner.os }}-buildrunner-${{ hashFiles('lib/**/*.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-buildrunner-

      - name: Run Riverpod generator
        if: steps.cache-buildrunner.outputs.cache-hit != 'true'
        run: flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Cache pigeon outputs
        id: cache-pigeon
        uses: actions/cache@v4
        with:
          path: |
            lib/src/audio_pigeon.g.dart
            android/app/src/main/kotlin/meditofoundation/medito/pigeon/AudioPigeon.g.kt
          key: ${{ runner.os }}-pigeon-${{ hashFiles('pigeon_conf.dart', 'pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pigeon-

      - name: Run Pigeon generator
        if: steps.cache-pigeon.outputs.cache-hit != 'true'
        run: flutter pub run pigeon --input pigeon_conf.dart --package_name=medito

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Unit Tests
        run: flutter test --dart-define-from-file=.prod.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-artifacts
          path: build/

  # Opt-in: open the PR as a draft and add the 'auto-ready' label, and it is
  # marked ready for review automatically once the checks job passes. Same-repo
  # PRs only — on fork PRs the workflow token is read-only.
  ready-for-review:
    name: Mark ready for review
    runs-on: ubuntu-latest
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft &&
      contains(github.event.pull_request.labels.*.name, 'auto-ready')
    permissions:
      pull-requests: write
    steps:
      - name: Mark PR ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        run: gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
