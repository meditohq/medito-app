name: Firebase Webhook → GitHub PR

on:
  repository_dispatch:
    types: [firebase-alert]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-pr:
    name: Create PR linked to Issue
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate payload
        id: validate
        env:
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          # Strip newlines/carriage-returns to prevent output injection
          TITLE=$(printf '%s' "$TITLE" | tr '\n\r' '  ')
          if [ -z "$TITLE" ]; then
            echo "::error::Missing required field: client_payload.title"
            exit 1
          fi
          # Sanitise branch name: lowercase, replace non-alphanum with hyphens
          SAFE=$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-60)
          # Fallback if title was only punctuation/whitespace
          if [ -z "$SAFE" ]; then
            SAFE="alert"
          fi
          BRANCH="firebase/${SAFE}-$(date +%s)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch with empty commit
        env:
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          git checkout -b "${{ steps.validate.outputs.branch }}"
          SAFE_TITLE=$(printf '%s' "$TITLE" | tr '\n\r' '  ' | cut -c1-100)
          git commit --allow-empty -m "firebase: ${SAFE_TITLE}"

      - name: Push branch
        run: git push -u origin "${{ steps.validate.outputs.branch }}"

      - name: Create Pull Request linked to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          SEVERITY: ${{ github.event.client_payload.severity }}
          SOURCE: ${{ github.event.client_payload.source }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
        run: |
          SEVERITY_LABEL=""
          case "${SEVERITY}" in
            critical) SEVERITY_LABEL="🔴 Critical" ;;
            high)     SEVERITY_LABEL="🟠 High" ;;
            medium)   SEVERITY_LABEL="🟡 Medium" ;;
            low)      SEVERITY_LABEL="🟢 Low" ;;
            *)        SEVERITY_LABEL="⚪ Unknown" ;;
          esac

          CLOSES_LINE=""
          if [ -n "$ISSUE_NUMBER" ]; then
            CLOSES_LINE="Closes #${ISSUE_NUMBER}"
          fi

          PR_URL=$(gh pr create \
            --base develop \
            --head "${{ steps.validate.outputs.branch }}" \
            --title "${SEVERITY_LABEL} [Firebase] ${TITLE}" \
            --body "$(cat <<PR_EOF
          ${CLOSES_LINE}

          ## Firebase Alert

          | Field | Value |
          |-------|-------|
          | **Source** | ${SOURCE:-firebase} |
          | **Event** | ${EVENT_TYPE:-unknown} |
          | **Severity** | ${SEVERITY_LABEL} |
          | **Issue** | ${ISSUE_NUMBER:+#$ISSUE_NUMBER} |

          ## Description

          ${DESCRIPTION:-No description provided.}

          ---

          *Auto-created by [Firebase Webhook workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})*
          PR_EOF
          )")

          echo "PR created: $PR_URL"

          # Assign Copilot as reviewer and assignee
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          gh pr edit "$PR_NUMBER" --add-assignee copilot --add-reviewer copilot
