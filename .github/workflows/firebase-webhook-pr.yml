name: Firebase Webhook → GitHub PR

on:
  repository_dispatch:
    types: [firebase-alert]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    name: Create PR from Firebase Event
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate payload
        id: validate
        run: |
          TITLE="${{ github.event.client_payload.title }}"
          if [ -z "$TITLE" ]; then
            echo "::error::Missing required field: client_payload.title"
            exit 1
          fi
          # Sanitise branch name: lowercase, replace non-alphanum with hyphens
          SAFE=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-60)
          BRANCH="firebase/${SAFE}-$(date +%s)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and issue file
        env:
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          SEVERITY: ${{ github.event.client_payload.severity }}
          SOURCE: ${{ github.event.client_payload.source }}
          TIMESTAMP: ${{ github.event.client_payload.timestamp }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
          RAW_DATA: ${{ toJSON(github.event.client_payload.data) }}
        run: |
          git checkout -b "${{ steps.validate.outputs.branch }}"

          mkdir -p .github/firebase-issues

          FILENAME=".github/firebase-issues/$(date +%Y%m%d-%H%M%S)-$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-50).md"

          cat > "$FILENAME" <<ISSUE_EOF
          # Firebase Alert: ${TITLE}

          | Field       | Value                          |
          |-------------|--------------------------------|
          | **Source**  | ${SOURCE:-firebase}            |
          | **Type**    | ${EVENT_TYPE:-unknown}         |
          | **Severity**| ${SEVERITY:-medium}            |
          | **Time**    | ${TIMESTAMP:-$(date -u +%Y-%m-%dT%H:%M:%SZ)} |

          ## Description

          ${DESCRIPTION:-No description provided.}

          ## Raw Data

          \`\`\`json
          ${RAW_DATA:-{}}
          \`\`\`

          ---
          *Auto-generated by Firebase Webhook workflow*
          ISSUE_EOF

          git add "$FILENAME"
          git commit -m "firebase: ${TITLE}"

      - name: Push branch
        run: git push -u origin "${{ steps.validate.outputs.branch }}"

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.client_payload.title }}
          DESCRIPTION: ${{ github.event.client_payload.description }}
          SEVERITY: ${{ github.event.client_payload.severity }}
          SOURCE: ${{ github.event.client_payload.source }}
          EVENT_TYPE: ${{ github.event.client_payload.event_type }}
        run: |
          SEVERITY_LABEL=""
          case "${SEVERITY}" in
            critical) SEVERITY_LABEL="🔴 Critical" ;;
            high)     SEVERITY_LABEL="🟠 High" ;;
            medium)   SEVERITY_LABEL="🟡 Medium" ;;
            low)      SEVERITY_LABEL="🟢 Low" ;;
            *)        SEVERITY_LABEL="⚪ Unknown" ;;
          esac

          gh pr create \
            --base develop \
            --head "${{ steps.validate.outputs.branch }}" \
            --title "🔥 [Firebase] ${TITLE}" \
            --body "$(cat <<PR_EOF
          ## Firebase Alert

          | Field | Value |
          |-------|-------|
          | **Source** | ${SOURCE:-firebase} |
          | **Event** | ${EVENT_TYPE:-unknown} |
          | **Severity** | ${SEVERITY_LABEL} |

          ## Description

          ${DESCRIPTION:-No description provided.}

          ---

          ### Next Steps
          - [ ] Investigate the issue
          - [ ] Implement fix
          - [ ] Add tests
          - [ ] Verify in staging

          *Auto-created by [Firebase Webhook workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})*
          PR_EOF
          )"
