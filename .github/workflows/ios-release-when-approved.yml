# Releases an approved iOS App Store version without anyone pressing "Release
# this version" in App Store Connect. release.yml submits with
# automatic_release: false, so an approved build waits in
# PENDING_DEVELOPER_RELEASE until something releases it.
#
# To arm it:    gh variable set IOS_RELEASE_WHEN_APPROVED --body 2610.6.3
# To disarm it: gh variable delete IOS_RELEASE_WHEN_APPROVED
# The scheduled run does nothing while the variable is unset, and the lane only
# acts on PENDING_DEVELOPER_RELEASE, so leaving it armed after release is harmless.
name: iOS – release when approved

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Marketing version to release once approved, e.g. 2610.6.3 (defaults to the IOS_RELEASE_WHEN_APPROVED variable)'
        required: false
        type: string

jobs:
  release-if-approved:
    name: Release if approved
    # Skipped entirely (no runner) while nothing is armed.
    if: ${{ inputs.app_version != '' || vars.IOS_RELEASE_WHEN_APPROVED != '' }}
    # Only App Store Connect API calls: no Xcode needed.
    runs-on: ubuntu-latest
    environment: prod
    env:
      APP_VERSION: ${{ inputs.app_version || vars.IOS_RELEASE_WHEN_APPROVED }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Release if approved
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          DEVELOPER_APP_IDENTIFIER: ${{ secrets.DEVELOPER_APP_IDENTIFIER }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.APP_STORE_CONNECT_TEAM_ID }}
          DEVELOPER_PORTAL_TEAM_ID: ${{ secrets.DEVELOPER_PORTAL_TEAM_ID }}
        run: bundle exec fastlane ios release_if_approved app_version:"$APP_VERSION"
