plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new FileNotFoundException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    throw new FileNotFoundException("keystore.properties file not found. Please create it from keystore.properties.example")
}

def facebookAppId = System.getenv('FACEBOOK_APP_ID') ?: ''
def facebookClientToken = System.getenv('FACEBOOK_CLIENT_TOKEN') ?: ''
def tiktokAndroidAppId = System.getenv('TIKTOK_ANDROID_APP_ID') ?: ''

def envJsonFile = rootProject.file("../.prod.json")
if (!envJsonFile.exists()) {
    envJsonFile = rootProject.file("../.staging.json")
}
if (envJsonFile.exists()) {
    try {
        def jsonText = envJsonFile.text
        if (!facebookAppId) {
            def appIdMatch = jsonText =~ /"FACEBOOK_APP_ID"\s*:\s*"([^"]+)"/
            if (appIdMatch) {
                facebookAppId = appIdMatch[0][1]
            }
        }
        if (!facebookClientToken) {
            def tokenMatch = jsonText =~ /"FACEBOOK_CLIENT_TOKEN"\s*:\s*"([^"]+)"/
            if (tokenMatch) {
                facebookClientToken = tokenMatch[0][1]
            }
        }
        if (!tiktokAndroidAppId) {
            def tiktokIdMatch = jsonText =~ /"TIKTOK_ANDROID_APP_ID"\s*:\s*"([^"]+)"/
            if (tiktokIdMatch) {
                tiktokAndroidAppId = tiktokIdMatch[0][1]
            }
        }
    } catch (Exception e) {
        println "Warning: Could not parse environment JSON file: ${e.message}"
    }
}

def isDebugBuild = project.gradle.startParameter.taskNames.any { it.toLowerCase().contains('debug') }
if (isDebugBuild) {
    println "Facebook App ID: ${facebookAppId ?: 'NOT SET'}"
    println "Facebook Client Token: ${facebookClientToken ?: 'NOT SET'}"
    println "TikTok Android App ID: ${tiktokAndroidAppId ?: 'NOT SET'}"
}

android {
    namespace "meditofoundation.medito"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    project.ext {
        APP_ID = keystoreProperties['appId']
        KEYSTORE_STORE_FILE = rootProject.file(keystoreProperties['storeFile'])
        KEYSTORE_STORE_PASSWORD = keystoreProperties['storePassword']
        KEYSTORE_KEY_ALIAS = keystoreProperties['keyAlias']
        KEYSTORE_KEY_PASSWORD = keystoreProperties['keyPassword']
        VERSION_CODE = flutterVersionCode.toInteger()
        VERSION_NAME = flutterVersionName
    }

    signingConfigs {
        release {
            storeFile project.KEYSTORE_STORE_FILE
            storePassword project.KEYSTORE_STORE_PASSWORD
            keyAlias project.KEYSTORE_KEY_ALIAS
            keyPassword project.KEYSTORE_KEY_PASSWORD
        }
    }

    defaultConfig {
        applicationId project.APP_ID
        minSdkVersion Math.max(flutter.minSdkVersion, 26)
        targetSdkVersion 36 
        versionCode project.VERSION_CODE
        versionName project.VERSION_NAME
        multiDexEnabled true
        manifestPlaceholders += [
            hostName: "medito.app",
            scheme: "https"
        ]
        
        resValue "string", "facebook_app_id", facebookAppId
        resValue "string", "facebook_client_token", facebookClientToken
        resValue "string", "tiktok_app_id", tiktokAndroidAppId
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        pickFirst '**/FlutterError.class'
        pickFirst '**/FlutterError$*.class'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/*.kotlin_module'
    }

    // Exclude FlutterError from superwallkit_flutter plugin
    configurations.all {
        exclude group: 'com.superwall.superwallkit_flutter', module: 'FlutterError'
    }


    // Exclude FlutterError from superwallkit_flutter at the dependency level
    configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'com.superwall.superwallkit_flutter' && 
                    details.requested.name.contains('FlutterError')) {
                    details.useTarget group: details.requested.group, name: details.requested.name, version: details.requested.version
                    details.because 'Exclude FlutterError from superwallkit_flutter to prevent duplication'
                }
            }
        }
    }

    // Additional exclusion for FlutterError at the DEX level
    configurations.all {
        exclude group: 'com.superwall.superwallkit_flutter', module: 'FlutterError'
        exclude group: 'com.superwall.superwallkit_flutter', module: 'flutter'
    }


    lintOptions {
        disable 'VitalAnalyzeRelease'
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
            // Temporarily disabled for TikTok testing - package name must match TikTok Events Manager
            // applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        prod {
            dimension "default"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.android.billingclient:billing:6.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Google Pay dependencies
    implementation 'com.google.android.gms:play-services-wallet:19.3.0'

    // Media3 dependencies
    def media3_version = "1.2.1"
    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"

    // Other potentially needed dependencies
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Glance App Widget
    implementation "androidx.glance:glance-appwidget:1.2.0-beta01"
    implementation "androidx.glance:glance:1.2.0-beta01"
    implementation "androidx.glance:glance-material:1.2.0-beta01"
}


configurations.all {
    resolutionStrategy {
        force "androidx.work:work-runtime:2.8.1"
        force "androidx.work:work-runtime-ktx:2.8.1"
    }
}