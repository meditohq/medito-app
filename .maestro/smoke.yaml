appId: meditofoundation.medito
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
- launchApp:
    clearState: true

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# ── Onboarding: Notifications ──
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "Next" which either opens the Superwall paywall (native modal) or
# an external browser (when Google Pay / Superwall aren't available on CI).
- extendedWaitUntil:
    visible: "Next"
    timeout: 10000
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot: after-donation-next

# If Superwall loaded, verify the donation tabs are present
- runFlow:
    when:
      visible: "(?i)monthly"
    commands:
      - assertVisible: "(?i)yearly"
      - takeScreenshot: superwall-paywall

# Dismiss whatever opened (paywall or browser) and return to the app.
# pressKey back closes the overlay; launchApp ensures the app is foregrounded
# (no-op if already there, recovers if Chrome took focus).
- pressKey: back
- launchApp:
    stopApp: false

# "Skip for Now" should now be visible on the donation screen
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 15000
- tapOn: "Skip for Now"

# ── Onboarding: Battery optimization (may or may not appear) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn: "Skip for Now"

# ── Onboarding: Experience question ──
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 15000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "Build a regular habit"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Result screen ──
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
# Note: Path tab is currently disabled in BottomActionBar homePage layout
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"

# ── Play a session via Your Daily ──
- extendedWaitUntil:
    visible: "Your Daily"
    timeout: 15000
- tapOn: "Your Daily"

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify the timer is advancing (format is MM:SS)
# First wait for the player to appear and start playback
- extendedWaitUntil:
    visible: "Pause"
    timeout: 15000

# Take a screenshot and verify the timer moved past 00:00
- takeScreenshot: player-playing
- assertVisible: "00:[0-5][1-9]"
