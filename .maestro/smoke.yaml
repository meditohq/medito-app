appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
# clearState wipes SharedPreferences so the app always starts fresh (no stale
# anonymous-auth state from a previous CI run that would skip the auth screen).
- launchApp:
    clearState: true

# ── Android only: dismiss "Pixel Launcher isn't responding" ANR dialog on CI ──
# Wrapped in platform:Android so iOS doesn't spend ~50 s on an irrelevant check.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "(?i)isn't responding"
          commands:
            - tapOn:
                text: "Wait"
                optional: true

# ── iOS only: dismiss OS-level "Sign in with Apple ID" dialog if present ──
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 120000
- tapOn: "Continue"

# ── Onboarding: Tracking permission (iOS only) ──
# Wait for the next onboarding screen to render before checking the
# conditional. Without this wait, `when: visible` races against the
# page transition and falsely skips the tracking block, then the later
# "Never tried it" assertion times out on the still-visible tracking
# screen (flaky — only repro'd when rendering was slower than usual).
- extendedWaitUntil:
    visible: "Help Us Improve Medito|Never tried it"
    timeout: 30000
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Battery optimization (Android only, conditional) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true

# ── Onboarding: Experience question ──
# Anonymous sign-in can take a while on first launch (clearState wipes the account)
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 60000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "Build a regular habit"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Attribution question ──
- extendedWaitUntil:
    visible: "A friend told me"
    timeout: 10000
- tapOn: "A friend told me"

# ── Onboarding: Notifications ──
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "See how to help". On simulators this opens donate.meditofoundation.org
# in the external browser (Apple Pay / Google Pay isn't available, so the app
# falls back from the Superwall paywall to the web donation page).
- extendedWaitUntil:
    visible: "See how to help"
    timeout: 20000
- tapOn: "See how to help"
- waitForAnimationToEnd
- takeScreenshot: after-donation-tap

# Wait for the donation web page to render (it has Monthly/Yearly tabs),
# screenshot it, then return to the app.
# Android: external Chrome → back button returns to the app.
# iOS:     external Safari → the "< Medito" back pill lives outside the
#          XCUITest a11y tree, so we relaunch the app without stopping it,
#          which brings the backgrounded Medito process back to foreground.
# Timeout is generous — Safari cold-start on a fresh simulator + DNS +
# TLS + page render can take 30-50s on CI runners.
- extendedWaitUntil:
    visible: "(?i)yearly"
    timeout: 60000
- assertVisible: "(?i)monthly"
- takeScreenshot: donation-paywall
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: back
- runFlow:
    when:
      platform: iOS
    commands:
      # launchApp: stopApp: false proved unreliable here — reported COMPLETED
      # but left the simulator on the home screen with Medito backgrounded.
      # openLink with the app's URL scheme reliably foregrounds the running
      # instance; the deep-link handler treats an empty path as "just open
      # the app" (deep_link_service.dart:114), so no route change.
      - openLink: "org.meditofoundation://"

# Wait until we're back on the onboarding donation screen.
- extendedWaitUntil:
    visible: "See how to help"
    timeout: 15000

# After dismissing the paywall, "Skip for Now" appears below the button.
- runFlow:
    when:
      visible: "Skip for Now"
    commands:
      - tapOn:
          text: "Skip for Now"
          retryTapIfNoChange: true
      - takeScreenshot: after-donation-skip

# ── Onboarding: Result screen ──
- runFlow:
    when:
      visible: "Get started"
    commands:
      - tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
# Note: Path tab is currently disabled in BottomActionBar homePage layout
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"

# ── Play a session via Your Daily ──
# Wait for the skeleton shimmer to resolve and real content to load.
# On a fresh install, anonymous auth + home API can take up to 60 s.
- extendedWaitUntil:
    visible: "Your Daily"
    timeout: 60000
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "Your Daily"
    direction: DOWN
    timeout: 15000
    speed: 20
    waitToSettleTimeoutMs: 500
    centerElement: true
- tapOn: "Your Daily"

# Your Daily may open a track (Play visible immediately) or a pack (list of sessions).
# If it opened a pack, tap the first session in the list to reach a track view.
- runFlow:
    when:
      notVisible: "Play"
    commands:
      - extendedWaitUntil:
          visible: "(?i)\\d+ - \\d+ min"
          timeout: 10000
      - scrollUntilVisible:
          element: "(?i)\\d+ - \\d+ min"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          text: "(?i)\\d+ - \\d+ min"
          index: 0

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify playback started (timer advances past 00:00)
- extendedWaitUntil:
    visible: "00:[0-5][1-9]"
    timeout: 20000
- takeScreenshot: player-playing
