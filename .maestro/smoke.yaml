appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
# clearState wipes SharedPreferences so the app always starts fresh (no stale
# anonymous-auth state from a previous CI run that would skip the auth screen).
- launchApp:
    clearState: true

# ── Android only: dismiss "Pixel Launcher isn't responding" ANR dialog on CI ──
# Wrapped in platform:Android so iOS doesn't spend ~50 s on an irrelevant check.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "(?i)isn't responding"
          commands:
            - tapOn:
                text: "Wait"
                optional: true

# ── iOS only: dismiss OS-level "Sign in with Apple ID" dialog if present ──
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 180000
- tapOn: "Continue"

# ── Onboarding: Experience question ──
# First onboarding screen. Anonymous sign-in can take a while on first
# launch (clearState wipes the account), so the timeout is generous.
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 60000
- tapOn: "Never tried it"

# Experience is now the ONLY onboarding question (the intent + attribution
# questions were removed). Selecting an option auto-advances straight to the
# donation primer — no second question to answer.

# ── Onboarding: Donation ──
# Two variants can render here:
#   - NATIVE donation page — forced on internal builds via
#     _forceNativeForInternalTesting (TODO(temp)), otherwise server-flagged.
#     Its donate CTA renders immediately; the close X (labelled "Skip for
#     Now") fades in top-right ~5s after load, mirroring the webview arm.
#   - WEBVIEW intro — the previous default ("See how to help" CTA); returns
#     when the temp force-native flag is reverted.
# Wait for whichever appears, then branch on the webview CTA.
- extendedWaitUntil:
    visible: "See how to help|.*Donate.*"
    timeout: 30000

# Native page path: nothing to drive without charging a card — screenshot,
# wait out the close-X delay, dismiss.
- runFlow:
    when:
      notVisible: "See how to help"
    commands:
      - takeScreenshot: paywall-native
      - extendedWaitUntil:
          visible: "Skip for Now"
          timeout: 15000
      - tapOn: "Skip for Now"

# Webview intro path, iOS: smoke builds enable SMOKE_TEST_MODE, which adds a
# deterministic close control to the webview route and reveals the skip button
# after returning. That still verifies the webview opens, without waiting on a
# remote page close affordance that is slow and flaky on iOS CI.
- runFlow:
    when:
      visible: "See how to help"
      platform: iOS
    commands:
      - tapOn: "See how to help"

      - extendedWaitUntil:
          visible: "Donation webview opened"
          timeout: 10000
      - takeScreenshot: paywall-webview
      - tapOn: "Donation webview opened"

      - extendedWaitUntil:
          visible: "Skip for Now"
          timeout: 20000
      - tapOn: "Skip for Now"

# Webview intro path, Android: release smoke uses the deployable APK, so it
# keeps the real production build settings and drives the donation webview
# before skipping.
- runFlow:
    when:
      visible: "See how to help"
      platform: Android
    commands:
      - tapOn: "See how to help"

      # Dismiss the webview. The webpage shows an x close glyph (aria-label
      # "Close") in the top-right that fades in 5s after the page loads.
      # Do NOT use waitForAnimationToEnd here -- the webview can keep loading
      # indefinitely on CI and block the step. Wait directly for Close instead,
      # with a generous timeout to cover slow CI network.
      - extendedWaitUntil:
          visible: "Close"
          timeout: 90000
      - takeScreenshot: paywall-webview

      # One tap is not enough: "Close is visible" is an accessibility-tree
      # check, and the glyph sits in the tree from page load while it is still
      # opacity:0 / pointer-events:none for its first 5s, so the wait above can
      # clear while the tap is still a no-op. That cost two release runs
      # (32850168903, 33071182758) on the same silent miss -- the webview was
      # still open afterwards with the X exactly where the tree said it was.
      # Retry until the app-side screen behind it comes back, which is the only
      # thing that actually proves the dismiss landed.
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible: "Close"
                commands:
                  - tapOn: "Close"
            - extendedWaitUntil:
                visible: "Skip for Now"
                timeout: 15000
      - tapOn: "Skip for Now"

# ── Onboarding: Notifications / smart reminders (re-added 26.6, sits
# between the donation primer and battery/tracking). Skip it for the
# smoke run — the system permission dialog is OS-driven and would
# otherwise stall the flow. Since the time-chips A/B concluded (2026-08-25)
# every user sees the "When will you meditate?" chips instead of a single
# CTA button (CI grants POST_NOTIFICATIONS up front via adb).
# The scrolling hero image (2607.10) pushes the CTA/chips below the fold on
# small simulators, so wait on the always-visible title and scroll the skip
# link into view before asserting/tapping it.
- extendedWaitUntil:
    visible: "Stay on Track with Meditation Reminders"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Skip for Now"
    direction: DOWN
- tapOn: "Skip for Now"

# ── Onboarding: Battery optimization (Android only, conditional) + ──
# ── Tracking permission (iOS only).                                 ──
# Wait for the next screen to render before checking the conditionals.
# Without this wait, `when: visible` races against the page transition
# and falsely skips the block, then the later "Get started" assertion
# times out on the still-visible previous screen.
- extendedWaitUntil:
    visible: "Update Setting|Help Us Improve Medito|Get started|Maybe later"
    timeout: 30000
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Result screen — advance to Home. ──
# Control arm shows a prominent "Get started". The first-meditation
# experiment arm (beginners, 50/50) instead shows an inline meditation with a
# quiet "Maybe later" skip — "Get started" there only appears AFTER the
# session completes — so for the smoke run we skip the session via
# "Maybe later". Tap whichever is present.
# The scrolling hero image can leave the CTA below the fold on small
# simulators — scroll it into view first.
- scrollUntilVisible:
    element:
      text: "Get started|Maybe later"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Get started|Maybe later"

# A donation prompt dialog ("Medito is a registered nonprofit") sometimes
# appears on Home post-onboarding — dismiss if present.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true

# ── Play a session via Your Path ──
# The Your Path card's accessibility label is a merged multi-line string
# like "Your Path: Getting started — Welcome\nYOUR PATH\n·\nGetting started\n...",
# so we use a regex with wildcards + DOTALL ((?s)) so "." matches newlines.
# Match on "YOUR PATH" rather than a pack title: onboarding now pins new users
# onto the pack sequence ("Getting started" for beginners, "Deepen your
# practice" for regulars) instead of the megapack, so the title here depends on
# who the account is. Pre-sequence installs with no pin still read
# "Medito's Journey", and this matches those too.
# On a fresh install, anonymous auth + home API can take up to 60s.
- extendedWaitUntil:
    visible: "(?si).*your path.*"
    timeout: 60000
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "(?si).*your path.*"
    direction: DOWN
    timeout: 15000
    speed: 20
    waitToSettleTimeoutMs: 500
    centerElement: true
- tapOn:
    text: "(?si).*your path.*"

# Your Path may open a track (Play visible immediately) or a pack (list of sessions).
# If it opened a pack, tap the first session in the list to reach a track view.
- runFlow:
    when:
      notVisible: "Play"
    commands:
      - extendedWaitUntil:
          visible: "(?i)\\d+ - \\d+ min"
          timeout: 10000
      - scrollUntilVisible:
          element: "(?i)\\d+ - \\d+ min"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          text: "(?i)\\d+ - \\d+ min"
          index: 0

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify playback started (timer advances past 00:00)
- extendedWaitUntil:
    visible: "00:[0-5][1-9]"
    timeout: 20000
- takeScreenshot: player-playing

# ── End screen after session ──
# Let the session play for a few seconds first, then skip to the end so the
# track completes and the end screen must appear. (00:0X-00:5X only
# — a minutes pattern would instantly match the always-visible total-duration
# label instead of the elapsed timer.)
- extendedWaitUntil:
    visible: "00:0[5-9]|00:[1-5][0-9]"
    timeout: 30000

# Tap the skip-forward button (labelled "Skip forward 10 seconds", though it
# skips 15s) until the track completes: the native seek clamps at the track
# duration, which triggers completion and the end screen ("day streak" is
# always shown on it). times caps the loop for safety (60 × 15s ≈ a 15-min
# track); the tap is optional because the button disappears mid-loop once the
# end screen starts animating in.
- repeat:
    times: 60
    while:
      notVisible: "(?s).*day streak.*"
    commands:
      - tapOn:
          text: "Skip forward 10 seconds"
          optional: true
      # A skip tap resolved against the player hierarchy but delivered after
      # the end screen has taken over lands on that screen's reminder CTA
      # instead, which raises the soft-ask dialog added in 2608.27. It is
      # modal, so it hides the streak text from the hierarchy: the loop would
      # spin out all 60 iterations and the assertion below would fail against
      # an end screen that is in fact right there behind it (run 33077160666).
      - runFlow:
          when:
            visible: "One quick thing"
          commands:
            - tapOn: "Not Now"

# Same dialog, last-moment case: raised by the final skip tap, after the loop
# has already exited on a visible streak.
- runFlow:
    when:
      visible: "One quick thing"
    commands:
      - tapOn: "Not Now"

# The end screen must now be visible — this is the actual assertion.
- extendedWaitUntil:
    visible: "(?s).*day streak.*"
    timeout: 30000
- takeScreenshot: end-screen
