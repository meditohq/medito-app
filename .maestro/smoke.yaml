appId: meditofoundation.medito
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# ── Onboarding: Notifications ──
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
- extendedWaitUntil:
    visible: "Next"
    timeout: 10000
- tapOn: "Next"

# Superwall paywall opens as a native modal.
# Wait for it to load, then press hardware back to dismiss.
- waitForAnimationToEnd
- pressKey: back

# After dismissing the paywall, "Skip for Now" appears on the donation screen
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 15000
- tapOn: "Skip for Now"

# ── Onboarding: Battery optimization (may or may not appear) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn: "Skip for Now"

# ── Onboarding: Experience question ──
- extendedWaitUntil:
    visible: "Have you meditated before?"
    timeout: 10000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "What are you hoping to get from Medito?"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Result screen ──
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Path"
- assertVisible: "Path"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"
