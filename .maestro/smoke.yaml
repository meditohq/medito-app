appId: meditofoundation.medito
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
- launchApp:
    clearState: true

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# ── Onboarding: Notifications ──
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "Next" which either opens the Superwall paywall (native modal) or
# an external browser (when Google Pay / Superwall aren't available on CI).
# Either way, press back to dismiss and return to the donation screen.
- extendedWaitUntil:
    visible: "Next"
    timeout: 10000
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot: after-donation-next
- pressKey: back
# Press back a second time in case the browser left a disambiguation dialog
# or an extra layer. If we're already on the donation screen this is harmless
# because "Skip for Now" will still be there.
- pressKey: back

# After dismissing, "Skip for Now" appears on the donation screen.
# If the double-back overshot and we landed on the notifications screen,
# re-launch the app to recover.
- runFlow:
    when:
      visible: "Skip for Now"
    commands:
      - tapOn: "Skip for Now"

# If the back presses landed us somewhere unexpected, re-launch to recover.
# The app remembers onboarding progress, so launchApp will resume.
- runFlow:
    when:
      notVisible: "1 of 2"
    commands:
      - launchApp:
          stopApp: false

# ── Onboarding: Battery optimization (may or may not appear) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn: "Skip for Now"

# ── Onboarding: Experience question ──
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 15000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "Build a regular habit"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Result screen ──
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Path"
- assertVisible: "Path"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"
