appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
env:
  APP_ID: meditofoundation.medito
  PLATFORM: android
---

# ── Launch app ──
- launchApp:

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 30000
- tapOn: "Continue"

# ── Onboarding: Notifications ──
# Anonymous sign-in can take a while on first launch (clearState wipes the account)
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 60000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "Next" which either opens the Superwall paywall (native modal) or
# an external browser (when Google Pay / Superwall aren't available).
- extendedWaitUntil:
    visible: "Next"
    timeout: 20000
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot: after-donation-next

# If Superwall loaded, verify the donation tabs are present.
# On Android: press back to dismiss the paywall.
# On iOS: wait for the close (X) button to appear and tap it.
- runFlow:
    when:
      visible: "(?i)monthly"
    commands:
      - assertVisible: "(?i)yearly"
      - takeScreenshot: superwall-paywall
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: back
      - runFlow:
          when:
            platform: iOS
          commands:
            - extendedWaitUntil:
                visible: "(?i)close|✕|×"
                timeout: 10000
            - tapOn:
                text: "(?i)close|✕|×"
                optional: true
            - pressKey: home
            - launchApp:
                stopApp: false

# If browser opened (CI / no Google Pay), it stole focus. Press Home first
# to leave the browser cleanly, then reopen our app.
- runFlow:
    when:
      notVisible: "Skip for Now"
    commands:
      - pressKey: home
      - launchApp:
          stopApp: false

# "Skip for Now" should now be visible on the donation screen.
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 15000
- tapOn:
    text: "Skip for Now"
    retryTapIfNoChange: true
- takeScreenshot: after-donation-skip

# ── Onboarding: Tracking permission (iOS only) ──
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      # ATT system dialog may appear — tap Allow if visible
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Battery optimization (Android only, conditional) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true

# ── Onboarding: Experience question ──
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 30000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "Build a regular habit"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Result screen ──
- extendedWaitUntil:
    visible: "Get started"
    timeout: 10000
- tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
# Note: Path tab is currently disabled in BottomActionBar homePage layout
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"

# ── Play a session via Your Daily ──
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "Your Daily"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: "Your Daily"

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify the timer is advancing (format is MM:SS)
# First wait for the player to appear and start playback
- extendedWaitUntil:
    visible: "Pause"
    timeout: 15000

# Take a screenshot and verify the timer moved past 00:00
- takeScreenshot: player-playing
- assertVisible: "00:[0-5][1-9]"
