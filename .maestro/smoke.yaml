appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
# clearState wipes SharedPreferences so the app always starts fresh (no stale
# anonymous-auth state from a previous CI run that would skip the auth screen).
- launchApp:
    clearState: true

# ── Android only: dismiss "Pixel Launcher isn't responding" ANR dialog on CI ──
# Wrapped in platform:Android so iOS doesn't spend ~50 s on an irrelevant check.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "(?i)isn't responding"
          commands:
            - tapOn:
                text: "Wait"
                optional: true

# ── iOS only: dismiss OS-level "Sign in with Apple ID" dialog if present ──
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 180000
- tapOn: "Continue"

# ── Onboarding: Experience question ──
# First onboarding screen. Anonymous sign-in can take a while on first
# launch (clearState wipes the account), so the timeout is generous.
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 60000
- tapOn: "Never tried it"

# Experience is now the ONLY onboarding question (the intent + attribution
# questions were removed). Selecting an option auto-advances straight to the
# donation primer — no second question to answer.

# ── Onboarding: Donation ──
# iOS smoke builds enable SMOKE_TEST_MODE, which adds a deterministic close
# control to the webview route and reveals the skip button after returning.
# That still verifies the webview opens, without waiting on a remote page close
# affordance that is slow and flaky on iOS CI.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "See how to help"
          timeout: 20000
      - tapOn: "See how to help"

      - extendedWaitUntil:
          visible: "Donation webview opened"
          timeout: 10000
      - takeScreenshot: paywall-webview
      - tapOn: "Donation webview opened"

      - extendedWaitUntil:
          visible: "Skip for Now"
          timeout: 20000
      - tapOn: "Skip for Now"

# Android release smoke uses the deployable APK, so it keeps the real production
# build settings and drives the donation webview before skipping.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "See how to help"
          timeout: 20000
      - tapOn: "See how to help"

      # Dismiss the webview. The webpage shows an x close glyph (aria-label
      # "Close") in the top-right that fades in 5s after the page loads.
      # Do NOT use waitForAnimationToEnd here -- the webview can keep loading
      # indefinitely on CI and block the step. Wait directly for Close instead,
      # with a generous timeout to cover slow CI network.
      - extendedWaitUntil:
          visible: "Close"
          timeout: 90000
      - takeScreenshot: paywall-webview
      - tapOn: "Close"

      - extendedWaitUntil:
          visible: "Skip for Now"
          timeout: 20000
      - tapOn: "Skip for Now"

# ── Onboarding: Notifications / smart reminders (re-added 26.6, sits
# between the donation primer and battery/tracking). Skip it for the
# smoke run — the system permission dialog is OS-driven and would
# otherwise stall the flow. The primary CTA varies by permission state:
# "Remind Me Daily" when notifications aren't granted yet, or
# "Turn on Smart Reminders" when they already are (CI grants
# POST_NOTIFICATIONS up front via adb).
- extendedWaitUntil:
    visible: "Remind Me Daily|Turn on Smart Reminders"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Battery optimization (Android only, conditional) + ──
# ── Tracking permission (iOS only).                                 ──
# Wait for the next screen to render before checking the conditionals.
# Without this wait, `when: visible` races against the page transition
# and falsely skips the block, then the later "Get started" assertion
# times out on the still-visible previous screen.
- extendedWaitUntil:
    visible: "Update Setting|Help Us Improve Medito|Get started|Maybe later"
    timeout: 30000
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Result screen — advance to Home. ──
# Control arm shows a prominent "Get started". The first-meditation
# experiment arm (beginners, 50/50) instead shows an inline meditation with a
# quiet "Maybe later" skip — "Get started" there only appears AFTER the
# session completes — so for the smoke run we skip the session via
# "Maybe later". Tap whichever is present.
- extendedWaitUntil:
    visible: "Get started|Maybe later"
    timeout: 30000
- tapOn:
    text: "Get started|Maybe later"

# A donation prompt dialog ("Medito is a registered nonprofit") sometimes
# appears on Home post-onboarding — dismiss if present.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true

# ── Play a session via Your Path ──
# The Your Path card's accessibility label is a merged multi-line string
# like "Your Path: Medito's Journey — Welcome\nYOUR PATH\n·\nMedito's Journey\n...",
# so we use a regex with wildcards + DOTALL ((?s)) so "." matches newlines.
# On a fresh install, anonymous auth + home API can take up to 60s.
- extendedWaitUntil:
    visible: "(?s).*Medito's Journey.*"
    timeout: 60000
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "(?s).*Medito's Journey.*"
    direction: DOWN
    timeout: 15000
    speed: 20
    waitToSettleTimeoutMs: 500
    centerElement: true
- tapOn:
    text: "(?s).*Medito's Journey.*"

# Your Path may open a track (Play visible immediately) or a pack (list of sessions).
# If it opened a pack, tap the first session in the list to reach a track view.
- runFlow:
    when:
      notVisible: "Play"
    commands:
      - extendedWaitUntil:
          visible: "(?i)\\d+ - \\d+ min"
          timeout: 10000
      - scrollUntilVisible:
          element: "(?i)\\d+ - \\d+ min"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          text: "(?i)\\d+ - \\d+ min"
          index: 0

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify playback started (timer advances past 00:00)
- extendedWaitUntil:
    visible: "00:[0-5][1-9]"
    timeout: 20000
- takeScreenshot: player-playing

# ── End screen after session ──
# Let the session play for a few seconds first, then drag the seek bar to the
# end so the track completes and the end screen must appear. (00:0X-00:5X only
# — a minutes pattern would instantly match the always-visible total-duration
# label instead of the elapsed timer.)
- extendedWaitUntil:
    visible: "00:0[5-9]|00:[1-5][0-9]"
    timeout: 30000

# The seek bar is a Flutter Slider centered vertically in the portrait player
# (title above, transport buttons below), with the track spanning ~6%–94% of
# the screen width. Material sliders jump the thumb to the touch-down point,
# so pressing near the right end of the track and dragging off the edge
# commits a seek to ~100% on release. The slider's exact y varies slightly
# with title wrapping, so retry at nearby heights if the end screen doesn't
# appear ("day streak" is always shown on it).
- swipe:
    start: 90%, 50%
    end: 96%, 50%
    duration: 2000
- extendedWaitUntil:
    visible: "(?s).*day streak.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "(?s).*day streak.*"
    commands:
      - swipe:
          start: 90%, 46%
          end: 96%, 46%
          duration: 2000
      - extendedWaitUntil:
          visible: "(?s).*day streak.*"
          timeout: 15000
          optional: true
- runFlow:
    when:
      notVisible: "(?s).*day streak.*"
    commands:
      - swipe:
          start: 90%, 54%
          end: 96%, 54%
          duration: 2000

# The end screen must now be visible — this is the actual assertion.
- extendedWaitUntil:
    visible: "(?s).*day streak.*"
    timeout: 30000
- takeScreenshot: end-screen
