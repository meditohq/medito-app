appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
- launchApp

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 60000
- tapOn: "Continue"

# ── Onboarding: Notifications ──
# Anonymous sign-in can take a while on first launch (clearState wipes the account)
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 60000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "Next" which either opens the Superwall paywall (native modal) or
# an external browser (when Google Pay / Superwall aren't available).
- extendedWaitUntil:
    visible: "Next"
    timeout: 20000
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot: after-donation-next

# If Superwall loaded, verify the donation tabs are present.
# On Android: press back to dismiss the paywall.
# On iOS: wait for the close (X) button to appear and tap it.
- runFlow:
    when:
      visible: "(?i)monthly"
    commands:
      - assertVisible: "(?i)yearly"
      - takeScreenshot: superwall-paywall
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: back
      - runFlow:
          when:
            platform: iOS
          commands:
            # Donation page may open as Superwall native modal (has ✕ close button)
            # or in SFSafariViewController. In either case try to close and fall
            # through to the home+relaunch fallback below.
            - tapOn:
                text: "(?i)close|✕|×"
                optional: true

# If not back on the donation/onboarding screen, press Home and relaunch.
- runFlow:
    when:
      notVisible: "Skip for Now"
    commands:
      - pressKey: home
      - launchApp:
          stopApp: false

# ── Remaining onboarding ──
# On iOS the browser donation page keeps the app running in the background and
# onboarding may auto-advance while the browser is open, so every step after
# the donation screen is conditional.

- runFlow:
    when:
      visible: "Skip for Now"
    commands:
      - tapOn:
          text: "Skip for Now"
          retryTapIfNoChange: true
      - takeScreenshot: after-donation-skip

# ── Onboarding: Tracking permission (iOS only) ──
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Battery optimization (Android only, conditional) ──
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true

# ── Onboarding: Experience question ──
- runFlow:
    when:
      visible: "Never tried it"
    commands:
      - tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- runFlow:
    when:
      visible: "Build a regular habit"
    commands:
      - tapOn: "Build a regular habit"

# ── Onboarding: Result screen ──
- runFlow:
    when:
      visible: "Get started"
    commands:
      - tapOn: "Get started"

# ── Home screen loaded ──
# After onboarding the app fetches real data; a skeleton shimmer shows first.
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
- extendedWaitUntil:
    visible: "Explore"
    timeout: 30000

# ── Navigate all tabs ──
# Note: Path tab is currently disabled in BottomActionBar homePage layout
- tapOn: "Explore"
- assertVisible: "Explore"

- tapOn: "Settings"
- assertVisible: "Settings"

- tapOn: "Home"
- assertVisible: "Home"

# ── Play a session via Your Daily ──
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "Your Daily"
    direction: DOWN
    timeout: 15000
    centerElement: true
- tapOn: "Your Daily"

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify the timer is advancing (format is MM:SS)
# First wait for the player to appear and start playback
- extendedWaitUntil:
    visible: "Pause"
    timeout: 15000

# Take a screenshot and verify the timer moved past 00:00
- takeScreenshot: player-playing
- assertVisible: "00:[0-5][1-9]"
