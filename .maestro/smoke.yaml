appId: ${APP_ID}
name: Smoke Test – Onboarding, Navigate, Verify Content
---

# ── Launch app ──
# clearState wipes SharedPreferences so the app always starts fresh (no stale
# anonymous-auth state from a previous CI run that would skip the auth screen).
- launchApp:
    clearState: true

# ── Android only: dismiss "Pixel Launcher isn't responding" ANR dialog on CI ──
# Wrapped in platform:Android so iOS doesn't spend ~50 s on an irrelevant check.
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow:
          when:
            visible: "(?i)isn't responding"
          commands:
            - tapOn:
                text: "Wait"
                optional: true

# ── iOS only: dismiss OS-level "Sign in with Apple ID" dialog if present ──
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          when:
            visible: "Cancel"
          commands:
            - tapOn: "Cancel"

# ── Splash screen ──
- extendedWaitUntil:
    visible: "Continue"
    timeout: 120000
- tapOn: "Continue"

# ── Onboarding: Experience question ──
# First onboarding screen. Anonymous sign-in can take a while on first
# launch (clearState wipes the account), so the timeout is generous.
- extendedWaitUntil:
    visible: "Never tried it"
    timeout: 60000
- tapOn: "Never tried it"

# ── Onboarding: Intent question ──
- extendedWaitUntil:
    visible: "Build a regular habit"
    timeout: 10000
- tapOn: "Build a regular habit"

# ── Onboarding: Attribution question ──
- extendedWaitUntil:
    visible: "A friend told me"
    timeout: 10000
- tapOn: "A friend told me"

# ── Onboarding: Notifications ──
- extendedWaitUntil:
    visible: "Skip for Now"
    timeout: 20000
- tapOn: "Skip for Now"

# ── Onboarding: Donation ──
# Tap "See how to help". On simulators this opens donate.meditofoundation.org
# in the external browser (Apple Pay / Google Pay isn't available, so the app
# falls back from the Superwall paywall to the web donation page).
- extendedWaitUntil:
    visible: "See how to help"
    timeout: 20000
- tapOn: "See how to help"
- waitForAnimationToEnd
- takeScreenshot: after-donation-tap

# The external browser opens (Chrome on Android, Safari on iOS). We don't
# assert on the paywall contents — CI emulators often have a fresh Chrome
# with a "Welcome to Chrome" first-run overlay that blocks the donation page
# from rendering. Instead we wait for the animation, screenshot what we got,
# then return to the app.
- waitForAnimationToEnd
- takeScreenshot: donation-paywall
- runFlow:
    when:
      platform: Android
    commands:
      # Press Home to leave Chrome, then relaunch the app (without clearState)
      # to foreground the backgrounded Medito process. pressKey: back is
      # unreliable on CI emulators where Chrome's first-run intercepts it.
      - pressKey: home
      - launchApp:
          appId: ${APP_ID}
          stopApp: false
- runFlow:
    when:
      platform: iOS
    commands:
      # openLink with the app's URL scheme foregrounds the running instance
      # from external Safari. On some iOS versions (26+) this pops a system
      # "Open in 'Medito'?" prompt first — tap Open if it appears. The
      # deep-link handler treats an empty path as "just open the app"
      # (deep_link_service.dart), so no route change.
      - openLink: "org.meditofoundation://"
      - runFlow:
          when:
            visible: "Open"
          commands:
            - tapOn: "Open"
      # openLink is flaky on CI — sometimes Safari stays foregrounded
      # instead of switching to the app. Force foreground as a fallback.
      - launchApp:
          appId: ${APP_ID}
          stopApp: false
      - waitForAnimationToEnd

# Post-paywall state is flaky on iOS CI — sometimes the app resumes on the
# donation primer (where "Skip for Now" now appears), sometimes it has
# advanced to the result screen or all the way to Home. Accept any of them
# and let the conditional blocks below route to the next step.
- extendedWaitUntil:
    visible: "Skip for Now|Get started|Home|Update Setting|Help Us Improve Medito"
    timeout: 30000

# Dismiss the donation primer if we're still on it.
- runFlow:
    when:
      visible: "See how to help"
    commands:
      - tapOn:
          text: "Skip for Now"
          retryTapIfNoChange: true
      - takeScreenshot: after-donation-skip

# ── Onboarding: Battery optimization (Android only, conditional) + ──
# ── Tracking permission (iOS only).                                 ──
# Wait for the next screen to render before checking the conditionals.
# Without this wait, `when: visible` races against the page transition
# and falsely skips the block, then the later "Get started" assertion
# times out on the still-visible previous screen.
- extendedWaitUntil:
    visible: "Update Setting|Help Us Improve Medito|Get started"
    timeout: 30000
- runFlow:
    when:
      visible: "Update Setting"
    commands:
      - tapOn:
          text: "Skip for Now"
          optional: true
- runFlow:
    when:
      visible: "Help Us Improve Medito"
    commands:
      - tapOn: "Continue"
      - runFlow:
          when:
            visible: "Allow"
          commands:
            - tapOn: "Allow"

# ── Onboarding: Result screen (skip if we already landed on Home) ──
- runFlow:
    when:
      visible: "Get started"
    commands:
      - tapOn: "Get started"

# A donation prompt dialog ("Medito is a registered nonprofit") sometimes
# appears on Home post-onboarding — dismiss if present.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true

# ── Play a session via Your Path ──
# The Your Path card's accessibility label is a merged multi-line string
# like "Your Path: Medito's Journey — Welcome\nYOUR PATH\n·\nMedito's Journey\n...",
# so we use a regex with wildcards + DOTALL ((?s)) so "." matches newlines.
# On a fresh install, anonymous auth + home API can take up to 60s.
- extendedWaitUntil:
    visible: "(?s).*Medito's Journey.*"
    timeout: 60000
# On small screens the shortcut may be below the fold
- scrollUntilVisible:
    element: "(?s).*Medito's Journey.*"
    direction: DOWN
    timeout: 15000
    speed: 20
    waitToSettleTimeoutMs: 500
    centerElement: true
- tapOn:
    text: "(?s).*Medito's Journey.*"

# Your Path may open a track (Play visible immediately) or a pack (list of sessions).
# If it opened a pack, tap the first session in the list to reach a track view.
- runFlow:
    when:
      notVisible: "Play"
    commands:
      - extendedWaitUntil:
          visible: "(?i)\\d+ - \\d+ min"
          timeout: 10000
      - scrollUntilVisible:
          element: "(?i)\\d+ - \\d+ min"
          direction: DOWN
          timeout: 10000
          visibilityPercentage: 50
      - tapOn:
          text: "(?i)\\d+ - \\d+ min"
          index: 0

# Track view loads with a play button
- extendedWaitUntil:
    visible: "Play"
    timeout: 15000
- tapOn: "Play"

# Player screen: verify playback started (timer advances past 00:00)
- extendedWaitUntil:
    visible: "00:[0-5][1-9]"
    timeout: 20000
- takeScreenshot: player-playing
