appId: ${APP_ID}
name: Dismiss onboarding donation without payment
---
# Native page path: nothing to drive without charging a card — screenshot,
# wait out the close-X delay, dismiss.
- runFlow:
    when:
      notVisible: "See how to help"
    commands:
      - takeScreenshot: paywall-native
      - extendedWaitUntil:
          visible: "Skip for Now"
          timeout: 15000
      - tapOn: "Skip for Now"

# Webview intro path, iOS: smoke builds enable SMOKE_TEST_MODE, which adds a
# deterministic close control to the webview route and advances automatically
# after returning. That still verifies the webview opens, without waiting on a
# remote page close affordance that is slow and flaky on iOS CI.
- runFlow:
    when:
      visible: "See how to help"
      platform: iOS
    commands:
      - tapOn: "See how to help"

      - extendedWaitUntil:
          visible: "Donation webview opened"
          timeout: 10000
      - takeScreenshot: paywall-webview
      # The control is in the hierarchy while the route is still sliding in,
      # so a single tap can land where it was and do nothing (run
      # 36312432526: tap "completed", webview still open). Retry until the
      # control is actually gone, as the Android path below does.
      - retry:
          maxRetries: 2
          commands:
            - runFlow:
                when:
                  visible: "Donation webview opened"
                commands:
                  - tapOn: "Donation webview opened"
            - extendedWaitUntil:
                notVisible: "Donation webview opened"
                timeout: 10000


# Webview intro path, Android: release smoke uses the deployable APK (no
# SMOKE_TEST_MODE close control). Leave with system back instead of the page's
# X: back pops the webview route just like Close (both callers ignore the
# result and advance), and it doesn't depend on the remote page loading. The
# X fades in 5s after load and a tap on it can silently miss (runs
# 32850168903, 33071182758, 36687309807), which made this the flakiest step.
- runFlow:
    when:
      visible: "See how to help"
      platform: Android
    commands:
      - tapOn: "See how to help"

      # The route is pushed only after the payment config preload (up to 5s),
      # so wait until it covers the intro — back any earlier would pop the
      # onboarding screen instead.
      - extendedWaitUntil:
          notVisible: "See how to help"
          timeout: 20000
      # Let the page finish loading before leaving. Backing out while it was
      # still a loading skeleton crashed the emulator outright (adb "device
      # not found") on both boots of run 37454547179; runs where the page had
      # already loaded survived. Optional: a page that never loads still
      # gets the back below.
      - extendedWaitUntil:
          visible: "Support Medito|Monthly|Yearly"
          timeout: 30000
          optional: true
      - takeScreenshot: paywall-webview
      - back
